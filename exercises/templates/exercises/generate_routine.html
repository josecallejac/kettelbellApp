{% extends "base.html" %}

{% block title %}Generador de Rutinas IA - KettleBell Pro{% endblock %}

{% block content %}
<section class="generator-section">
    <div class="container-sm">
        <div class="generator-card">
            <div class="generator-header">
                <div class="generator-badge">✨</div>
                <h1 class="generator-title">Generador de <span class="gradient-text">Rutinas IA</span></h1>
                <p class="generator-subtitle">
                    Define tus objetivos y deja que diseñemos el entrenamiento perfecto para ti en segundos.
                </p>
            </div>

            <form method="post" class="generator-form">
                {% csrf_token %}

                <div class="gen-group">
                    <label class="gen-label"><span class="dot dot-blue"></span> Duración Total</label>
                    <div class="option-grid cols-4">
                                                <label class="option-tile">
                            <input type="radio" name="duration" value="15">
                            <span class="tile-body"><span class="tile-big">15</span><span class="tile-small">min</span></span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="duration" value="30" checked>
                            <span class="tile-body"><span class="tile-big">30</span><span class="tile-small">min</span></span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="duration" value="45">
                            <span class="tile-body"><span class="tile-big">45</span><span class="tile-small">min</span></span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="duration" value="60">
                            <span class="tile-body"><span class="tile-big">60</span><span class="tile-small">min</span></span>
                        </label>
                    </div>
                </div>

                <div class="gen-group">
                    <label class="gen-label"><span class="dot dot-green"></span> Nivel de Dificultad</label>
                    <div class="option-grid cols-3">
                        <label class="option-tile">
                            <input type="radio" name="difficulty" value="beginner" {% if default_difficulty == 'beginner' %}checked{% endif %}>
                            <span class="tile-body tile-tall">
                                <span class="tile-emoji">🌱</span>
                                <span class="tile-name">Principiante</span>
                                <span class="tile-desc">Técnica básica</span>
                            </span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="difficulty" value="intermediate" {% if default_difficulty != 'beginner' and default_difficulty != 'advanced' %}checked{% endif %}>
                            <span class="tile-body tile-tall">
                                <span class="tile-emoji">⚡</span>
                                <span class="tile-name">Intermedio</span>
                                <span class="tile-desc">Intensidad media</span>
                            </span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="difficulty" value="advanced" {% if default_difficulty == 'advanced' %}checked{% endif %}>
                            <span class="tile-body tile-tall">
                                <span class="tile-emoji">🔥</span>
                                <span class="tile-name">Avanzado</span>
                                <span class="tile-desc">Alta intensidad</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="gen-group">
                    <label class="gen-label"><span class="dot dot-purple"></span> Enfoque Principal</label>
                    <div class="option-grid cols-4">
                        <label class="option-tile">
                            <input type="radio" name="focus" value="mix" {% if default_focus != 'strength' and default_focus != 'cardio' and default_focus != 'full_body' and default_focus != 'flexibility' %}checked{% endif %}>
                            <span class="tile-body tile-tall">
                                <span class="tile-emoji">⚖️</span>
                                <span class="tile-name">Balanceado</span>
                            </span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="focus" value="strength" {% if default_focus == 'strength' %}checked{% endif %}>
                            <span class="tile-body tile-tall">
                                <span class="tile-emoji">💪</span>
                                <span class="tile-name">Fuerza</span>
                            </span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="focus" value="cardio" {% if default_focus == 'cardio' %}checked{% endif %}>
                            <span class="tile-body tile-tall">
                                <span class="tile-emoji">🫀</span>
                                <span class="tile-name">Cardio/HIIT</span>
                            </span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="focus" value="full_body" {% if default_focus == 'full_body' %}checked{% endif %}>
                            <span class="tile-body tile-tall">
                                <span class="tile-emoji">🎯</span>
                                <span class="tile-name">Full Body</span>
                            </span>
                        </label>
                        <label class="option-tile">
                            <input type="radio" name="focus" value="flexibility" {% if default_focus == 'flexibility' %}checked{% endif %}>
                            <span class="tile-body tile-tall">
                                <span class="tile-emoji">🧘</span>
                                <span class="tile-name">Movilidad</span>
                            </span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg generator-submit">
                    ✨ Generar Mi Rutina Personalizada
                </button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
