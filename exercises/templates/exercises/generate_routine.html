{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-12">
    <div class="max-w-2xl mx-auto">
        <div class="bg-gray-800 rounded-2xl p-8 backdrop-blur-sm bg-opacity-90 border border-gray-700 shadow-xl">
            <h1 class="text-3xl font-bold text-white mb-6 text-center">Generador de Rutinas IA</h1>
            <p class="text-gray-400 text-center mb-10">
                Selecciona tus preferencias y nuestra inteligencia generará una rutina de pesas rusas balanceada y adaptada a ti.
            </p>

            <form method="post" class="space-y-8">
                {% csrf_token %}
                
                <!-- Duration -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Duración Total</label>
                    <div class="grid grid-cols-4 gap-4">
                        {% for mins in "15 30 45 60"|make_list %}
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="{{ mins }}" class="peer sr-only" {% if mins == "30" %}checked{% endif %}>
                            <div class="flex flex-col items-center justify-center p-4 bg-gray-700 rounded-xl border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-900/30 transition-all hover:bg-gray-600">
                                <span class="text-xl font-bold text-white">{{ mins }}</span>
                                <span class="text-xs text-gray-400">min</span>
                            </div>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <!-- Difficulty -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Nivel de Dificultad</label>
                    <div class="grid grid-cols-3 gap-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="difficulty" value="beginner" class="peer sr-only">
                            <div class="p-4 bg-gray-700 rounded-xl border-2 border-transparent peer-checked:border-green-500 peer-checked:bg-green-900/30 transition-all hover:bg-gray-600 text-center">
                                <span class="block font-medium text-white">Principiante</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="difficulty" value="intermediate" class="peer sr-only" checked>
                            <div class="p-4 bg-gray-700 rounded-xl border-2 border-transparent peer-checked:border-yellow-500 peer-checked:bg-yellow-900/30 transition-all hover:bg-gray-600 text-center">
                                <span class="block font-medium text-white">Intermedio</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="difficulty" value="advanced" class="peer sr-only">
                            <div class="p-4 bg-gray-700 rounded-xl border-2 border-transparent peer-checked:border-red-500 peer-checked:bg-red-900/30 transition-all hover:bg-gray-600 text-center">
                                <span class="block font-medium text-white">Avanzado</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Focus -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Enfoque Principal</label>
                    <select name="focus" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="mix">Mixto (Balanceado)</option>
                        <option value="strength">Fuerza y Potencia</option>
                        <option value="cardio">Cardio / HIIT</option>
                        <option value="full_body">Cuerpo Completo</option>
                        <option value="flexibility">Movilidad y Flexibilidad</option>
                    </select>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 px-8 rounded-xl shadow-lg transform transition hover:-translate-y-1 hover:shadow-2xl flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                        </svg>
                        Generar Rutina
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
