[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    "venv",
    "exercises/migrations",
]

[tool.ruff.lint]
# Reglas por defecto (E4, E7, E9, F) + orden de imports.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Scripts standalone: django.setup() debe ejecutarse antes de importar modelos.
"populate_exercises.py" = ["E402"]
"fix_exercise_text_encoding.py" = ["E402"]
"test_routine_generator.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["exercises", "kettelbell"]
